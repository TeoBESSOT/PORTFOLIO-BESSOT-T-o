<p class="eyebrow">ESPACE ADMINISTRATEUR</p><h1>Connexion</h1>
<p class="lead narrow">Connecte-toi pour ajouter et modifier le contenu de tes fiches.</p>
<form id="loginForm" class="detail-panel">
<label for="email">Adresse e-mail</label><input class="url-input" style="width:100%;margin:8px 0 18px" id="email" type="email" autocomplete="username" required>
<label for="password">Mot de passe</label><input class="url-input" style="width:100%;margin:8px 0 18px" id="password" type="password" autocomplete="current-password" required>
<button class="button primary" type="submit">Se connecter</button>
<p id="message" class="muted" role="status"></p>
</form></main>
